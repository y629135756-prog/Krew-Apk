<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krew Apk | Store & Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <style>
        :root { --primary: #01875f; --bg: #ffffff; --text-main: #202124; --text-sub: #5f6368; --border: #dadce0; --admin: #d93025; --green-logo: #00e676; }
        * { box-sizing: border-box; font-family: 'Google Sans', sans-serif; margin: 0; padding: 0; }
        body { background-color: var(--bg); padding-bottom: 75px; }

        /* Header */
        .header { background: var(--primary); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; gap: 10px; }
        .logo-text { color: white; font-weight: 700; font-size: 18px; white-space: nowrap; }
        .logo-text span { color: var(--green-logo); }
        .search-bar { background: white; border-radius: 25px; padding: 6px 12px; display: flex; align-items: center; gap: 8px; flex-grow: 1; }
        .search-bar input { border: none; outline: none; width: 100%; font-size: 13px; background: transparent; padding: 5px 0; }
        .notif-btn { color: white; position: relative; cursor: pointer; display: flex; align-items: center; }
        .dot { position: absolute; top: 2px; right: 2px; width: 8px; height: 8px; background: red; border-radius: 50%; border: 1px solid var(--primary); display: none; }

        /* Banner (Only for Home) */
        .banner-container { width: 100%; height: 140px; overflow: hidden; position: relative; }
        .banner-wrapper { display: flex; transition: transform 0.5s ease-in-out; height: 100%; }
        .banner-slide { min-width: 100%; height: 100%; object-fit: cover; }

        /* Sponsored Page Style */
        .sp-page-content { padding: 15px; }
        .sp-card { width: 100%; background: #fff; border-radius: 15px; overflow: hidden; border: 1px solid #eee; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .sp-ss { width: 100%; height: 200px; object-fit: cover; }
        .sp-info { display: flex; align-items: center; padding: 15px; gap: 12px; }
        .sp-logo { width: 50px; height: 50px; border-radius: 12px; }
        .sp-name { font-weight: 700; font-size: 16px; flex-grow: 1; }
        .sp-label { font-size: 10px; background: #f1f3f4; padding: 2px 8px; border-radius: 4px; font-weight: bold; }

        /* Common Grid */
        main { padding: 15px; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 12px; margin-bottom: 30px; }
        .card { text-align: center; cursor: pointer; }
        .card .img-container { width: 100%; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; border: 1px solid #f0f0f0; margin-bottom: 6px; }
        .card img { width: 100%; height: 100%; object-fit: cover; }
        .card-name { font-size: 11px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        /* Nav */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .nav-item { text-align: center; color: var(--text-sub); cursor: pointer; font-size: 10px; flex: 1; }
        .nav-item.active { color: var(--primary); }
        .nav-item .material-icons-outlined { display: block; font-size: 24px; margin-bottom: 2px; }

        /* Dev Edit Section */
        .dev-app-card { background: #f8f9fa; border-radius: 12px; padding: 15px; margin-bottom: 12px; border: 1px solid #eee; }
        .edit-input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 13px; }
        .update-btn { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }

        #pageDetails { position: fixed; inset: 0; background: white; z-index: 2000; overflow-y: auto; display: none; }
        .install-big { background: var(--primary); color: white; border: none; padding: 15px; width: calc(100% - 40px); margin: 20px; border-radius: 30px; font-weight: bold; cursor: pointer; }
        .modal { position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:3000; display:none; align-items:center; justify-content:center; }
        .modal-content { background:white; padding:20px; border-radius:20px; width:85%; max-height:80vh; overflow-y:auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-text">Krew<span>Apk</span></div>
        <div class="search-bar">
            <span class="material-icons-outlined" style="color:gray; font-size:18px">search</span>
            <input type="text" id="searchInput" placeholder="Search..." oninput="handleSearch()">
        </div>
        <div class="notif-btn" onclick="openNotif()">
            <span class="material-icons-outlined">notifications</span>
            <div id="notif-dot" class="dot"></div>
        </div>
    </div>

    <!-- Banner (Visible ONLY on Store/Home) -->
    <div id="top-banner" class="banner-container">
        <div class="banner-wrapper" id="banner-wrapper"></div>
    </div>

    <main id="main-content">
        <!-- Tab: Store (Home) -->
        <section id="tab-store">
            <h3 style="margin-bottom:15px">Recommended Apps</h3>
            <div class="app-grid" id="grid-discover"></div>
        </section>

        <!-- Tab: Sponsored (New Page) -->
        <section id="tab-sponsored" class="hidden">
            <h3 style="margin-bottom:15px">Featured Deals</h3>
            <div class="sp-page-content" id="sp-list">
                <!-- Sponsored apps show here -->
            </div>
        </section>

        <!-- Tab: Games -->
        <section id="tab-games" class="hidden">
            <h3 style="margin-bottom:15px">All Games</h3>
            <div class="app-grid" id="grid-games"></div>
        </section>

        <!-- Tab: Hot -->
        <section id="tab-hot" class="hidden">
            <h3 style="margin-bottom:15px">Top Trending</h3>
            <div class="app-grid" id="grid-hot"></div>
        </section>

        <!-- Tab: Me -->
        <section id="tab-me" class="hidden">
            <div id="auth-area">
                <div style="text-align:center; padding:50px 20px">
                    <span class="material-icons-outlined" style="font-size:80px; color:#ccc">account_circle</span>
                    <p style="margin:10px 0; color:gray">Developer Portal</p>
                    <button class="install-big" onclick="openModal('authModal')">Login / Register</button>
                </div>
            </div>
            
            <div id="studio-area" class="hidden">
                <h2 id="welcome-msg" style="padding:15px"></h2>
                <button class="install-big" onclick="openModal('appModal')">+ Upload App</button>
                <div style="padding:15px">
                    <h3>Manage My Apps</h3>
                    <div id="my-uploads"></div>
                </div>
                <button onclick="logout()" style="color:red; border:none; background:none; padding:20px; width:100%">Logout</button>
            </div>
        </section>
    </main>

    <!-- Modals (Notifications, Details, etc) -->
    <div id="notifModal" class="modal"><div class="modal-content"><h3 id="notif-title">Recent Updates</h3><div id="notif-list"></div><button onclick="closeModal('notifModal')" class="install-big">Close</button></div></div>
    <div id="pageDetails"><div style="padding:15px" onclick="closeDetails()"><span class="material-icons-outlined">arrow_back</span></div><div id="details-body"></div></div>
    <div id="authModal" class="modal"><div class="modal-content"><h3>Login</h3><input type="text" id="log-u" placeholder="User"><input type="password" id="log-p" placeholder="Pass"><button class="install-big" onclick="login()">Enter Studio</button></div></div>
    <div id="appModal" class="modal"><div class="modal-content"><h3>Upload</h3><input type="text" id="new-name" placeholder="Name"><select id="new-cat"><option>Game</option><option>Apps</option></select><input type="text" id="new-logo" placeholder="Logo URL"><input type="text" id="new-ss" placeholder="Screenshots (comma)"><input type="text" id="new-file" placeholder="File Link"><textarea id="new-desc" placeholder="Desc"></textarea><button class="install-big" onclick="uploadApp()">Publish</button></div></div>

    <div class="bottom-nav">
        <div class="nav-item active" onclick="switchNav('store', this)"><span class="material-icons-outlined">storefront</span>HOME</div>
        <div class="nav-item" onclick="switchNav('sponsored', this)"><span class="material-icons-outlined">stars</span>OFFERS</div>
        <div class="nav-item" onclick="switchNav('games', this)"><span class="material-icons-outlined">sports_esports</span>GAMES</div>
        <div class="nav-item" onclick="switchNav('hot', this)"><span class="material-icons-outlined">local_fire_department</span>HOT</div>
        <div class="nav-item" onclick="switchNav('me', this)"><span class="material-icons-outlined">account_circle</span>ME</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, get, update, remove, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAAParmwu5XOUlmANfhdybXTWRbdsFEWwc",
            authDomain: "play-ea926.firebaseapp.com",
            databaseURL: "https://play-ea926-default-rtdb.firebaseio.com",
            projectId: "play-ea926",
            storageBucket: "play-ea926.firebasestorage.app",
            messagingSenderId: "228076443690",
            appId: "1:228076443690:web:5550101f131d0f30760b53"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = JSON.parse(localStorage.getItem('user')) || null;
        let allApps = [];
        let bannerUrls = [];

        // Fetch Banners
        onValue(ref(db, 'banners'), s => {
            bannerUrls = s.val() ? Object.values(s.val()) : [];
            document.getElementById('banner-wrapper').innerHTML = bannerUrls.map(u => `<img src="${u}" class="banner-slide">`).join('');
        });

        // Banner Interval (1s)
        let bIdx = 0;
        setInterval(() => {
            if(bannerUrls.length) {
                bIdx = (bIdx + 1) % bannerUrls.length;
                document.getElementById('banner-wrapper').style.transform = `translateX(-${bIdx*100}%)`;
            }
        }, 1000);

        // Fetch Apps
        onValue(ref(db, 'apps'), s => {
            const data = s.val();
            allApps = data ? Object.keys(data).map(k => ({id:k, ...data[k]})) : [];
            
            const lastCount = localStorage.getItem('lastAppCount') || 0;
            if(allApps.length > lastCount) document.getElementById('notif-dot').style.display='block';
            
            renderUI();
            renderNotifs();
        });

        function renderUI() {
            populate('grid-discover', allApps);
            populate('grid-games', allApps.filter(a => a.category === 'Game'));
            populate('grid-hot', [...allApps].sort((a,b) => (b.rank || 0) - (a.rank || 0)));
            
            // Render Sponsored Page
            const spApps = allApps.filter(a => a.isSponsored);
            document.getElementById('sp-list').innerHTML = spApps.map(a => `
                <div class="sp-card" onclick="openDetails('${a.id}')">
                    <img src="${a.screens ? a.screens[0] : a.logo}" class="sp-ss">
                    <div class="sp-info">
                        <img src="${a.logo}" class="sp-logo">
                        <div class="sp-name">${a.name}</div>
                        <span class="sp-label">PROMOTED</span>
                    </div>
                </div>
            `).join('');

            if(currentUser) {
                document.getElementById('auth-area').classList.add('hidden');
                document.getElementById('studio-area').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = "Hi, " + currentUser.user;
                
                const myApps = allApps.filter(a => a.devId === currentUser.user);
                document.getElementById('my-uploads').innerHTML = myApps.map(a => `
                    <div class="dev-app-card">
                        <b>${a.name}</b>
                        <input type="text" id="link-${a.id}" class="edit-input" value="${a.file}">
                        <div style="display:flex; justify-content:space-between">
                            <button class="update-btn" onclick="updateLink('${a.id}')">Update Link</button>
                            <span class="material-icons-outlined" style="color:red; cursor:pointer" onclick="deleteApp('${a.id}')">delete</span>
                        </div>
                        <div id="stat-${a.id}" style="color:green; font-size:11px; margin-top:5px"></div>
                    </div>
                `).join('');
            }
        }

        function populate(id, list) {
            const el = document.getElementById(id);
            if(!el) return;
            el.innerHTML = list.map(a => `<div class="card" onclick="openDetails('${a.id}')"><div class="img-container"><img src="${a.logo}"></div><div class="card-name">${a.name}</div></div>`).join('');
        }

        function renderNotifs() {
            const recent = [...allApps].reverse().slice(0, 5);
            document.getElementById('notif-list').innerHTML = recent.map(a => `
                <div style="display:flex; gap:10px; padding:10px; border-bottom:1px solid #eee" onclick="openDetails('${a.id}')">
                    <img src="${a.logo}" width="40" height="40" style="border-radius:8px">
                    <div><b>${a.name}</b><br><small>New app added</small></div>
                </div>
            `).join('');
        }

        window.updateLink = async (id) => {
            const link = document.getElementById('link-'+id).value;
            await update(ref(db, `apps/${id}`), { file: link });
            document.getElementById('stat-'+id).innerText = "Updated successfully!";
            setTimeout(() => document.getElementById('stat-'+id).innerText = "", 3000);
        };

        window.switchNav = (t, el) => {
            // Hide banner if NOT on Home
            document.getElementById('top-banner').style.display = (t === 'store') ? 'block' : 'none';
            
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById('tab-'+t).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        };

        window.openDetails = (id) => {
            const a = allApps.find(x => x.id === id);
            const ss = a.screens ? a.screens.map(s => `<img src="${s}" style="height:160px; border-radius:10px; margin-right:10px">`).join('') : '';
            document.getElementById('details-body').innerHTML = `
                <div style="padding:20px; display:flex; gap:15px; align-items:center">
                    <img src="${a.logo}" style="width:80px; border-radius:15px; box-shadow:0 2px 8px rgba(0,0,0,0.1)">
                    <div><h2>${a.name}</h2><p style="color:var(--primary)">${a.devName}</p></div>
                </div>
                <div style="display:flex; overflow-x:auto; padding:0 20px; margin-bottom:15px">${ss}</div>
                <p style="padding:20px; color:gray; line-height:1.4">${a.desc}</p>
                <button class="install-big" onclick="download('${a.id}','${a.file}')">Install Application</button>
            `;
            document.getElementById('pageDetails').style.display = 'block';
        };

        window.login = async () => {
            const u = document.getElementById('log-u').value.trim().toLowerCase();
            const p = document.getElementById('log-p').value;
            const snap = await get(ref(db, 'users/'+u));
            if(snap.exists() && snap.val().pass === p) { currentUser={user:u}; localStorage.setItem('user', JSON.stringify(currentUser)); location.reload(); }
            else if(!snap.exists()) { await set(ref(db, 'users/'+u), {user:u, pass:p}); currentUser={user:u}; localStorage.setItem('user', JSON.stringify(currentUser)); location.reload(); }
            else alert("Error");
        };

        window.uploadApp = async () => {
            const data = {
                name: document.getElementById('new-name').value,
                category: document.getElementById('new-cat').value,
                logo: document.getElementById('new-logo').value,
                screens: document.getElementById('new-ss').value.split(','),
                file: document.getElementById('new-file').value,
                desc: document.getElementById('new-desc').value,
                devId: currentUser.user, devName: currentUser.user, downloads: 0, rank: 0, isSponsored: false
            };
            await push(ref(db, 'apps'), data);
            location.reload();
        };

        window.download = (id, link) => { update(ref(db, `apps/${id}`), { downloads: increment(1) }); window.open(link, '_blank'); };
        window.deleteApp = (id) => confirm("Delete this app?") && remove(ref(db, `apps/${id}`));
        window.logout = () => { localStorage.removeItem('user'); location.reload(); };
        window.openModal = (id) => document.getElementById(id).style.display='flex';
        window.closeModal = (id) => document.getElementById(id).style.display='none';
        window.closeDetails = () => document.getElementById('pageDetails').style.display='none';
        window.openNotif = () => { 
            document.getElementById('notif-dot').style.display='none'; 
            localStorage.setItem('lastAppCount', allApps.length); 
            openModal('notifModal'); 
        };
        window.handleSearch = () => {
            const q = document.getElementById('searchInput').value.toLowerCase();
            populate('grid-discover', allApps.filter(a => a.name.toLowerCase().includes(q)));
        };
    </script>
</body>
</html>
